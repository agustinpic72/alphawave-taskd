<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">AlphaWave TaskD mark</title>
  <desc id="desc">A dark rounded-square mark with a warm-to-green wave that resolves into a task check.</desc>
  <defs>
    <radialGradient id="halo" cx="34%" cy="20%" r="70%">
      <stop offset="0" stop-color="#34493e"/>
      <stop offset="0.54" stop-color="#17201d"/>
      <stop offset="1" stop-color="#0d0f11"/>
    </radialGradient>
    <linearGradient id="stroke" x1="108" y1="276" x2="404" y2="276" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d8b764"/>
      <stop offset="0.5" stop-color="#78cfa4"/>
      <stop offset="1" stop-color="#c6f5d8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-35%" width="140%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.36"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#76c79d" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#halo)"/>
  <rect x="39" y="39" width="434" height="434" rx="89" fill="none" stroke="#34413b" stroke-width="18"/>
  <path
    d="M106 310c51 0 60-120 112-120 46 0 54 120 99 120 35 0 50-58 79-97"
    fill="none"
    stroke="url(#stroke)"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="43"
    filter="url(#glow)"
  />
  <path
    d="M320 310l57 57 63-134"
    fill="none"
    stroke="#f0d58b"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="38"
    filter="url(#glow)"
  />
</svg>
