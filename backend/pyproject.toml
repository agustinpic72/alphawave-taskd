[project]
name = "alphawave-taskd-backend"
version = "0.1.0"
description = "Local task daemon backend for alphawave-taskd"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "openai==3.5.0",
    "pydantic-settings>=2.6.0",
    "python-dateutil>=2.9.0",
    "sqlalchemy>=2.0.35",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
